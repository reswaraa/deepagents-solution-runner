[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-solution-runner"
version = "0.1.0"
description = "Config-first prototype that assembles DeepAgents-based AI solutions from solution.yaml."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "AI Architecture & Solution" },
]
dependencies = [
    "deepagents>=0.2.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
bedrock = ["langchain-aws>=0.2.0", "boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
solution-runner = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
